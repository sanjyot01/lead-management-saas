spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/leadmanagement
    username: leaduser
    password: leadpass123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password: redispass123
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
    jpa:
      repositories:
        bootstrap-mode: lazy

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT Configuration (Development)
# WARNING: Use strong secret in production (via environment variable)
jwt:
  secret: "lead-management-saas-jwt-secret-key-minimum-256-bits-required-for-hs256-algorithm"
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    com.leadmanagement: DEBUG
    org.springframework.web: DEBUG



