version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadmgmt-postgres
    environment:
      POSTGRES_DB: leadmanagement
      POSTGRES_USER: leaduser
      POSTGRES_PASSWORD: leadpass123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaduser -d leadmanagement"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadmgmt-network

  redis:
    image: redis:7-alpine
    container_name: leadmgmt-redis
    command: redis-server --appendonly yes --requirepass redispass123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadmgmt-network

volumes:
  postgres_data:
  redis_data:

networks:
  leadmgmt-network:
    driver: bridge